<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <div th:fragment="phantrang(duongDan, trangHienTai, tongSoTrang)" th:if="${tongSoTrang > 1}">
        <section class="phantrang py-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-auto text-center d-flex align-items-center gap-3">

                        <!-- Nút << Về trang đầu -->
                        <a th:href="${duongDan == ''} ? |?page=1| : @{${duongDan}(page=1)}" 
                           class="page-link-custom border-0 btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center"
                           style="width: 40px; height: 40px;"
                           th:classappend="${(trangHienTai ?: 1) <= 1 ? 'disabled' : ''}">
                            <i class="bi bi-chevron-double-left text-dark"></i>
                        </a>

                        <!-- Nút < Lùi 1 trang -->
                        <a th:href="${duongDan == ''} ? |?page=${(trangHienTai ?: 1) - 1}| : @{${duongDan}(page=${(trangHienTai ?: 1) - 1})}" 
                           class="page-link-custom btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center"
                           style="width: 40px; height: 40px;"
                           th:classappend="${(trangHienTai ?: 1) <= 1 ? 'disabled' : ''}">
                            <i class="bi bi-chevron-left text-dark"></i>
                        </a>

                        <!-- Ô Input nhập số trang -->
                        <span>
                            <input id="pageInput" type="number" min="1" 
                                   th:max="${tongSoTrang ?: 10}" 
                                   th:value="${trangHienTai ?: 1}"
                                   class="form-control d-inline-block text-center border-secondary fw-bold" 
                                   style="width: 60px; display: inline-block; box-shadow: none;"
                                   th:attr="data-url=${duongDan == ''} ? '' : @{${duongDan}}, data-max=${tongSoTrang ?: 10}"/>
                            <span class="fw-bold mx-1">/ [[${tongSoTrang ?: 10}]]</span>
                        </span>

                        <!-- Nút > Tiến 1 trang -->
                        <a th:href="${duongDan == ''} ? |?page=${(trangHienTai ?: 1) + 1}| : @{${duongDan}(page=${(trangHienTai ?: 1) + 1})}" 
                           class="page-link-custom btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center"
                           style="width: 40px; height: 40px;"
                           th:classappend="${(trangHienTai ?: 1) >= (tongSoTrang ?: 10) ? 'disabled' : ''}">
                            <i class="bi bi-chevron-right text-dark"></i>
                        </a>

                        <!-- Nút >> Đến trang cuối -->
                        <a th:href="${duongDan == ''} ? |?page=${tongSoTrang ?: 10}| : @{${duongDan}(page=${tongSoTrang ?: 10})}" 
                           class="page-link-custom border-0 btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center"
                           style="width: 40px; height: 40px;"
                           th:classappend="${(trangHienTai ?: 1) >= (tongSoTrang ?: 10) ? 'disabled' : ''}">
                            <i class="bi bi-chevron-double-right text-dark"></i>
                        </a>

                    </div>
                </div>
            </div>
        </section>

        <!-- Javascript xử lý nhảy trang -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const jumpInput = document.getElementById('pageInput');
                if (jumpInput) {
                    jumpInput.addEventListener('keypress', function (e) {
                        if (e.key === 'Enter') {
                            let page = parseInt(this.value);
                            let maxPage = parseInt(this.getAttribute('data-max'));
                            let baseUrl = this.getAttribute('data-url');
                            
                            if (isNaN(page) || page < 1) page = 1;
                            if (page > maxPage) page = maxPage;
                            
                            window.location.href = (baseUrl === '' ? '' : baseUrl) + "?page=" + page;
                        }
                    });
                }
            });
        </script>
    </div>

</body>
</html>
