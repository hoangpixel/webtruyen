<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top shadow-sm" style="background-color: var(--bs-body-bg);">
        <div class="container">
            <a class="navbar-brand text-hot fw-bold" th:href="@{/}"><i class="bi bi-book-half"></i> Tàng Kinh Các</a>
            
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                
                <form th:action="@{/tim-kiem}" method="GET" class="d-flex mx-lg-auto my-3 my-lg-0 gap-2 w-100" style="max-width: 550px;">
                    <input class="form-control" name="tenTruyen" type="search" placeholder="Nhập tên truyện..." th:value="${tuKhoa}">
                    
                    <button class="btn btn-outline-warning flex-shrink-0" type="submit" title="Tìm kiếm nhanh">
                        <i class="bi bi-search"></i>
                    </button>
                    
                    <a th:href="@{/tim-kiem-nang-cao}" class="btn btn-outline-info flex-shrink-0" title="Tìm kiếm nâng cao">
                        <i class="bi bi-funnel-fill"></i>
                    </a>
                </form>

                <ul class="navbar-nav align-items-lg-center gap-3 gap-lg-0">
                    
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="btn btn-danger text-white px-4 w-100 w-lg-auto" th:href="@{/dang-nhap}">Đăng Nhập</a>
                    </li>

                    <li class="nav-item dropdown ms-lg-3" sec:authorize="isAuthenticated()">
                        <a class="nav-link text-info fw-bold d-flex align-items-center" href="#" data-bs-toggle="dropdown" role="button">
                            <img th:src="@{|/images/avatar/${#authentication.principal.taiKhoan.avatar}|}" class="rounded-circle me-2 shadow-sm" alt="Avatar" style="width: 35px; height: 35px; object-fit: cover;"> 
                            <span th:text="${#authentication.principal.taiKhoan.hoTen}"></span>
                        </a>
                        
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-lg-2" style="background-color: var(--bs-body-bg);">
                            <li><a class="dropdown-item py-2" th:href="@{/chi-tiet-nguoi-dung}"><i class="bi bi-person-lines-fill text-primary me-2"></i> Thông tin cá nhân</a></li>
                            <li><a class="dropdown-item py-2" th:href="@{/truyen-yeu-thich}"><i class="bi bi-heart-fill text-danger me-2"></i> Tủ truyện của tôi</a></li>
                            
                            <li sec:authorize="hasAnyAuthority('XEM_TRUYEN', 'XEM_TAI_KHOAN', 'XEM_CHUONG', 'XEM_DANH_GIA', 'XEM_VAI_TRO', 'XEM_THE_LOAI')">
                                <a class="dropdown-item py-2 text-warning fw-bold" th:href="@{/admin}"><i class="bi bi-shield-lock-fill me-2"></i> Vào Sở Chỉ Huy</a>
                            </li>
                            
                            <li><hr class="dropdown-divider"></li>
                            
                            <li>
                                <a class="dropdown-item py-2 text-danger fw-bold" th:href="@{/dang-xuat}"><i class="bi bi-box-arrow-right me-2"></i> Đăng xuất</a>
                            </li>
                        </ul>
                    </li>
                    
                    <li class="nav-item ms-lg-3 d-flex align-items-center border-top border-lg-0 pt-2 pt-lg-0 mt-2 mt-lg-0">
                        <button class="btn p-0 d-flex align-items-center gap-2" id="btn-theme-toggle" style="border: none; font-size: 1.2rem;">
                            <i class="bi bi-moon-stars-fill text-warning" id="icon-theme"></i>
                            <span class="d-lg-none fw-bold text-muted fs-6">Đổi giao diện</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</body>
</html>
