<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top shadow-sm" style="background-color: var(--bs-body-bg);">
        <div class="container">
            <a class="navbar-brand text-hot" th:href="@{/}"><i class="bi bi-book-half"></i> Tàng Kinh Các</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <form th:action="@{/tim-kiem}" method="GET" class="d-flex mx-auto w-50">
                    <input class="form-control me-2" name="tenTruyen" type="search" placeholder="Nhập tên truyện..." th:value="${tuKhoa}">
                    <button class="btn btn-outline-warning" type="submit"><i class="bi bi-search"></i></button>
                </form>
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item" th:if="${session.nguoiDung == null}">
                        <a class="btn btn-danger text-white px-3 me-2" th:href="@{/login-user}">Đăng Nhập</a>
                    </li>

                    <li class="nav-item dropdown ms-3" th:if="${session.nguoiDung != null}">
                        <a class="nav-link text-info fw-bold d-flex align-items-center" href="#" role="button">
                            <img th:src="@{|/images/${session.avatar}|}" class="rounded-circle me-2" alt="Avatar" style="width: 35px; height: 35px; object-fit: cover;"> 
                            <span th:text="${session.nguoiDung}"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0" style="background-color: var(--bs-body-bg);">
                            <li><a class="dropdown-item py-2" th:href="@{/chi-tiet-user}"><i class="bi bi-person-lines-fill text-primary me-2"></i> Thông tin cá nhân</a></li>
                            <li><a class="dropdown-item py-2" th:href="@{/truyen-yeu-thich}"><i class="bi bi-heart-fill text-danger me-2"></i> Tủ truyện của tôi</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item py-2 text-danger fw-bold" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i> Đăng xuất</a></li>
                        </ul>
                    </li>
                    
                    <li class="nav-item">
                        <button class="btn" id="btn-theme-toggle" style="border: none; font-size: 1.2rem;">
                            <i class="bi bi-moon-stars-fill text-warning" id="icon-theme"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</body>
</html>
