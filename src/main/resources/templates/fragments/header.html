<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top shadow-sm" style="background-color: var(--bs-body-bg);">
        <div class="container">
            <a class="navbar-brand text-hot" th:href="@{/}"><i class="bi bi-book-half"></i> Tàng Kinh Các</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <form th:action="@{/tim-kiem}" method="GET" class="d-flex mx-auto w-50 gap-2">
                    <input class="form-control" name="tenTruyen" type="search" placeholder="Nhập tên truyện..." th:value="${tuKhoa}">
                    
                    <button class="btn btn-outline-warning flex-shrink-0" type="submit" title="Tìm kiếm nhanh">
                        <i class="bi bi-search"></i>
                    </button>
                    
                    <a th:href="@{/tim-kiem-nang-cao}" class="btn btn-outline-info flex-shrink-0" title="Tìm kiếm nâng cao">
                        <i class="bi bi-funnel-fill"></i>
                    </a>
                </form>


                    <ul class="navbar-nav align-items-center">
                        
                        <!-- CHƯA ĐĂNG NHẬP (isAnonymous) -->
                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a class="btn btn-danger text-white px-3 me-2" th:href="@{/dang-nhap}">Đăng Nhập</a>
                        </li>

                        <!-- ĐÃ ĐĂNG NHẬP (isAuthenticated) -->
                        <li class="nav-item dropdown ms-3" sec:authorize="isAuthenticated()">
                            <a class="nav-link text-info fw-bold d-flex align-items-center" href="#" role="button">
                                <!-- Lấy avatar từ đối tượng CustomUserDetails (thuộc tính taiKhoan.avatar) -->
                                <img th:src="@{|/images/avatar/${#authentication.principal.taiKhoan.avatar}|}" class="rounded-circle me-2" alt="Avatar" style="width: 35px; height: 35px; object-fit: cover;"> 
                                
                                <!-- Lấy Tên hiển thị -->
                                <span th:text="${#authentication.principal.taiKhoan.hoTen}"></span>
                            </a>
                            
                            <ul class="dropdown-menu dropdown-menu-end shadow border-0" style="background-color: var(--bs-body-bg);">
                                <li><a class="dropdown-item py-2" th:href="@{/chi-tiet-nguoi-dung}"><i class="bi bi-person-lines-fill text-primary me-2"></i> Thông tin cá nhân</a></li>
                                <li><a class="dropdown-item py-2" th:href="@{/truyen-yeu-thich}"><i class="bi bi-heart-fill text-danger me-2"></i> Tủ truyện của tôi</a></li>
                                
                                <!-- Nút vào trang Admin (Chỉ hiện nếu có quyền ROLE_ADMIN) -->
                                <li sec:authorize="hasRole('ADMIN')">
                                    <a class="dropdown-item py-2 text-warning fw-bold" th:href="@{/admin}"><i class="bi bi-shield-lock-fill me-2"></i> Vào Sở Chỉ Huy</a>
                                </li>
                                
                                <li><hr class="dropdown-divider"></li>
                                
                                <!-- Nút Đăng Xuất -->
                                <li>
                                    <!-- Spring Security yêu cầu đăng xuất bằng form POST, nhưng nếu ông đã cấu hình GET thì dùng the <a> cũng được -->
                                    <a class="dropdown-item py-2 text-danger fw-bold" th:href="@{/dang-xuat}"><i class="bi bi-box-arrow-right me-2"></i> Đăng xuất</a>
                                </li>
                            </ul>
                        </li>
                        
                        <!-- Nút Đổi Màu Của Ông -->
                        <li class="nav-item">
                            <button class="btn" id="btn-theme-toggle" style="border: none; font-size: 1.2rem;">
                                <i class="bi bi-moon-stars-fill text-warning" id="icon-theme"></i>
                            </button>
                        </li>
                    </ul>
            </div>
        </div>
    </nav>

</body>
</html>
