<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tủ Truyện Yêu Thích</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/user/css/list_yeu_thich.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container mt-4">
        
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none text-muted">Trang Chủ</a></li>
                <li class="breadcrumb-item active text-danger fw-bold" aria-current="page">Tủ Truyện Của Tôi</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">
            <h4 class="mb-0 fw-bold"><i class="bi bi-bookmarks"></i> ([[${tongTruyenDaLuu}]])</h4>
            <a th:href="@{/bo-luu-tat-ca}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash3"></i> Xóa tất cả</a>
        </div>

        <div class="row">
            <div th:each="item : ${danhSachYeuThich}" class="col-6 col-md-3 mb-4">
                <div class="card h-100 bg-body-tertiary position-relative">
                     <a th:href="@{/bo-luu-truyen-yeu-thich/{id}(id=${item.id})}" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2 btn-xoa" title="Bỏ lưu">
                        <i class="bi bi-heartbreak-fill"></i>
                     </a>
                    
                    <img th:src="@{'/images/truyen/' + ${item.truyen.anhBia}}" class="card-img-top truyen-bia" alt="Bìa truyện">
                    <div class="card-body p-2 d-flex flex-column">
                        <h6 class="card-title text-truncate mb-1" th:text="${item.truyen.tenTruyen}">Ta Là Tà Đế</h6>
                        <small class="text-muted mb-2"><i class="bi bi-bookmark-check"></i> Đang theo dõi</small>
                        <a th:href="@{/chi-tiet-truyen/{id}(id=${item.truyen.id})}" class="btn btn-outline-warning btn-sm mt-auto fw-bold">Xem Chi Tiết</a>
                    </div>
                </div>
            </div>
            
            <div class="col-12 text-center py-5" th:if="${danhSachYeuThich} == null">
                <h1 class="text-muted"><i class="bi bi-inbox"></i></h1>
                <p class="text-muted">Tủ truyện của bạn đang trống. Hãy ra trang chủ tìm truyện hay nhé!</p>
            </div>

        </div>
    </div>

   <div th:replace="~{fragments/phan_trang :: phantrang(duongDan='', trangHienTai=${trangHienTai}, tongSoTrang=${tongSoTrang})}"></div>
        <div th:if="${thongbao != null}" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div id="thongBaoToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${thongbao}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <div th:if="${loi != null}" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div id="loiToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${loi}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/user/js/doi_mau.js}"></script>
    <script th:src="@{/user/js/thong_bao.js}"></script>
</body>
</html>
