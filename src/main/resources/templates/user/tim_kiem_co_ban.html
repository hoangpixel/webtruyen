<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết Quả Tìm Kiếm - Tàng Kinh Các</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        .truyen-bia { height: 250px; object-fit: cover; border-radius: 5px; }
        .text-hot { color: #ff5722; font-weight: bold; }
        .card-truyen { transition: 0.3s; border: none; }
        .card-truyen:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4); }
        .dropdown:hover .dropdown-menu {
            display: block;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- THANH ĐIỀU HƯỚNG -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm" style="background-color: var(--bs-body-bg);">
        <div class="container">
            <a class="navbar-brand text-hot" href="/index.html"><i class="bi bi-book-half"></i> Tàng Kinh Các</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Chú ý form action này nha -->
                <form class="d-flex mx-auto w-50" action="/tim-kiem-co-ban" method="GET">
                    <input class="form-control me-2" type="search" name="tuKhoa" placeholder="Nhập tên truyện, tác giả...">
                    <button class="btn btn-outline-warning" type="submit"><i class="bi bi-search"></i></button>
                </form>
                
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <button class="btn" id="btn-theme-toggle" style="border: none; font-size: 1.2rem;">
                            <i class="bi bi-moon-stars-fill text-warning" id="icon-theme"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- NỘI DUNG CHÍNH -->
    <div class="container mt-4 mb-5">
        
        <!-- BREADCRUMB -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index.html" class="text-decoration-none text-muted">Trang Chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Tìm kiếm</li>
            </ol>
        </nav>

        <!-- TIÊU ĐỀ KẾT QUẢ -->
        <div class="d-flex align-items-center mb-4 border-bottom pb-2">
            <h4 class="mb-0 fw-bold">
                <i class="bi bi-search text-warning"></i> Kết quả tìm kiếm cho: <span class="text-hot">"Tà Đế"</span>
            </h4>
            <span class="badge bg-secondary ms-3">Tìm thấy 3 truyện</span>
        </div>

        <!-- LƯỚI KẾT QUẢ -->
        <div class="row">
            <!-- Kết quả 1 -->
            <div class="col-6 col-md-3 col-lg-2 mb-4">
                <div class="card card-truyen h-100 bg-body-tertiary">
                    <a href="/user/chi_tiet.html" class="text-decoration-none text-reset">
                        <img src="https://via.placeholder.com/200x300" class="card-img-top truyen-bia" alt="Bìa truyện">
                        <div class="card-body p-2 text-center">
                            <h6 class="card-title text-truncate mb-1" style="font-size: 14px;">Ta Là Tà Đế</h6>
                            <small class="text-muted"><i class="bi bi-eye"></i> 1.2M</small>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Kết quả 2 -->
            <div class="col-6 col-md-3 col-lg-2 mb-4">
                <div class="card card-truyen h-100 bg-body-tertiary">
                    <a href="/user/chi_tiet.html" class="text-decoration-none text-reset">
                        <img src="https://via.placeholder.com/200x300" class="card-img-top truyen-bia" alt="Bìa truyện">
                        <div class="card-body p-2 text-center">
                            <h6 class="card-title text-truncate mb-1" style="font-size: 14px;">Ma Đế Trùng Sinh</h6>
                            <small class="text-muted"><i class="bi bi-eye"></i> 800K</small>
                        </div>
                    </a>
                </div>
            </div>
            
            <!-- Trường hợp không tìm thấy truyện nào -->
            <!-- 
            <div class="col-12 text-center py-5">
                <h1 class="text-muted"><i class="bi bi-emoji-frown"></i></h1>
                <h5 class="text-muted mt-3">Xin lỗi, không tìm thấy truyện nào phù hợp với từ khóa của bạn.</h5>
                <a href="/index.html" class="btn btn-outline-warning mt-3">Quay Lại Trang Chủ</a>
            </div>
            -->
        </div>
        
    </div>

    <!-- Script Bootstrap & JS Đổi Màu (Xài chung file) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/user/js/doi_mau.js}"></script>
</body>
</html>
