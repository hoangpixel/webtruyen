<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Truyện - Tàng Kinh Các</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Select2 CSS (Thư viện làm cái ComboBox xịn xò) -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    
    <style>
        .text-hot { color: #ff5722; font-weight: bold; }
        .comic-page {
            width: 100%;
            max-width: 800px;
            display: block;
            margin: 0 auto;
            border-bottom: 2px solid #000;
        }
        
        .select2-container--default .select2-selection--single {
            background-color: var(--bs-body-bg);
            border: 1px solid #6c757d;
            height: 38px;
            display: flex;
            align-items: center;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--bs-body-color);
        }
        .select2-dropdown { background-color: var(--bs-body-bg); border: 1px solid #6c757d; }
        .select2-results__option { color: var(--bs-body-color); }
        .select2-container--default .select2-results__option--highlighted[aria-selected] { background-color: #ff5722; }
        .dropdown:hover .dropdown-menu {
            display: block;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="sticky-top shadow-sm py-2" style="background-color: var(--bs-tertiary-bg);">
        <div class="container d-flex justify-content-center align-items-center gap-2">
            
            <a th:if="${chuongTruoc != null}" 
               th:href="@{/doc-truyen/{slug}/{idTruyen}/{idChuong}(slug=${truyen.slug}, idTruyen=${truyen.id}, idChuong=${chuongTruoc.id})}" 
               class="btn btn-outline-danger">
               <i class="bi bi-chevron-left"></i> Trước
            </a>
            <button th:if="${chuongTruoc == null}" class="btn btn-outline-secondary" disabled>
               <i class="bi bi-chevron-left"></i> Trước
            </button>
            
            <div style="width: 250px;">
                <select class="form-control select2-chuong" id="chonChuong" 
                        th:attr="data-base-url=@{/doc-truyen/{slug}/{idTruyen}(slug=${truyen.slug}, idTruyen=${truyen.id})}">
                    <option th:each="c : ${dsChuong}" 
                            th:value="${c.id}" 
                            th:text="'Chương ' + ${c.soChuong} + ': ' + ${c.tenChuong}"
                            th:selected="${c.id == chuong.id}">
                    </option>
                </select>
            </div>

            <a th:if="${chuongSau != null}" 
               th:href="@{/doc-truyen/{slug}/{idTruyen}/{idChuong}(slug=${truyen.slug}, idTruyen=${truyen.id}, idChuong=${chuongSau.id})}" 
               class="btn btn-danger">
               Sau <i class="bi bi-chevron-right"></i>
            </a>
            <button th:if="${chuongSau == null}" class="btn btn-secondary" disabled>
               Sau <i class="bi bi-chevron-right"></i>
            </button>
            
        </div>
    </div>

    <div class="container-fluid p-0 bg-black text-center mt-3 pb-5">
        <!-- Dùng dummy image, sau này Thymeleaf sẽ lặp th:each in ra mớ ảnh này -->
        <img th:each="anh : ${dsAnhChuong}" th:src="@{|/images/chuong/${anh.tenFileAnh}|}" class="comic-page" th:alt="|Trang ${anh.thuTu}|">
    </div>
    <div class="shadow-sm py-2" style="background-color: var(--bs-tertiary-bg);">
        <div class="container d-flex justify-content-center align-items-center gap-2">
            
            <!-- Nút Lùi Chương -->
            <a th:if="${chuongTruoc != null}" 
               th:href="@{/doc-truyen/{slug}/{idTruyen}/{idChuong}(slug=${truyen.slug}, idTruyen=${truyen.id}, idChuong=${chuongTruoc.id})}" 
               class="btn btn-outline-danger">
               <i class="bi bi-chevron-left"></i> Chap Trước
            </a>
            <button th:if="${chuongTruoc == null}" class="btn btn-outline-secondary" disabled>
               <i class="bi bi-chevron-left"></i> Chap Trước
            </button>
            
            <div style="width: 250px;">
                <select class="form-control select2-chuong" 
                        th:attr="data-base-url=@{/doc-truyen/{slug}/{idTruyen}(slug=${truyen.slug}, idTruyen=${truyen.id})}">
                    <option th:each="c : ${dsChuong}" 
                            th:value="${c.id}" 
                            th:text="'Chương ' + ${c.soChuong} + ': ' + ${c.tenChuong}"
                            th:selected="${c.id == chuong.id}">
                    </option>
                </select>
            </div>

            <a th:if="${chuongSau != null}" 
               th:href="@{/doc-truyen/{slug}/{idTruyen}/{idChuong}(slug=${truyen.slug}, idTruyen=${truyen.id}, idChuong=${chuongSau.id})}" 
               class="btn btn-danger">
               Chap Sau <i class="bi bi-chevron-right"></i>
            </a>
            <button th:if="${chuongSau == null}" class="btn btn-secondary" disabled>
               Chap Sau <i class="bi bi-chevron-right"></i>
            </button>
            
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script th:src="@{/user/js/doi_mau.js}"></script>
    <script>
        $(document).ready(function() {
            $('.select2-chuong').select2({
                width: '100%' 
            });

            // Bắt sự kiện change cho mượt
            $('.select2-chuong').on('change', function () {
                let chuongId = $(this).val();
                let baseUrl = $(this).attr('data-base-url');
                
                if(chuongId && baseUrl) {
                    window.location.href = baseUrl + "/" + chuongId; 
                }
            });
        });
    </script>
</body>
</html>
