<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Truyện - Tàng Kinh Các</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Select2 CSS (Thư viện làm cái ComboBox xịn xò) -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    
    <style>
        /* Tối ưu hóa vùng đọc truyện */
        .comic-page {
            width: 100%;
            max-width: 800px; /* Giới hạn độ rộng để đọc trên PC không bị mỏi cổ */
            display: block;
            margin: 0 auto;
            border-bottom: 2px solid #000; /* Phân cách giữa các trang */
        }
        
        /* Chỉnh lại giao diện của Select2 cho hợp với Dark Mode */
        .select2-container--default .select2-selection--single {
            background-color: var(--bs-body-bg);
            border: 1px solid #6c757d;
            height: 38px;
            display: flex;
            align-items: center;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--bs-body-color);
        }
        .select2-dropdown { background-color: var(--bs-body-bg); border: 1px solid #6c757d; }
        .select2-results__option { color: var(--bs-body-color); }
        .select2-container--default .select2-results__option--highlighted[aria-selected] { background-color: #ff5722; }
    </style>
</head>
<body>

    <!-- THANH ĐIỀU HƯỚNG CƠ BẢN -->
    <nav class="navbar navbar-expand-lg border-bottom" style="background-color: var(--bs-body-bg);">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-warning fw-bold" href="/user/chi_tiet.html">
                <i class="bi bi-arrow-left-circle"></i> Trở về trang chi tiết
            </a>
            
            <button class="btn ms-auto" id="btn-theme-toggle" style="border: none; font-size: 1.2rem;">
                <i class="bi bi-moon-stars-fill text-warning" id="icon-theme"></i>
            </button>
        </div>
    </nav>

    <!-- THANH CÔNG CỤ ĐỌC TRUYỆN (STICKY HEADER - Dính trên đầu) -->
    <div class="sticky-top shadow-sm py-2" style="background-color: var(--bs-tertiary-bg);">
        <div class="container d-flex justify-content-center align-items-center gap-2">
            <!-- Nút Lùi Chương -->
            <button class="btn btn-outline-danger"><i class="bi bi-chevron-left"></i> Chap Trước</button>
            
            <!-- ComboBox Select2 chọn chương -->
            <div style="width: 250px;">
                <select class="form-control select2-chuong" id="chonChuong">
                    <option value="1">Chương 1: Xuyên Không Thành Trai Bao</option>
                    <option value="2">Chương 2: Hệ Thống Chọc Tức Người Khác</option>
                    <option value="3" selected>Chương 3: Mỹ Nữ Xin Tự Trọng</option>
                    <option value="4">Chương 4: Kế Hoạch Bỏ Trốn</option>
                    <!-- Tưởng tượng có 1000 chương ở đây, xài Select2 tìm kiếm phát ra luôn -->
                </select>
            </div>

            <!-- Nút Tới Chương -->
            <button class="btn btn-danger">Chap Sau <i class="bi bi-chevron-right"></i></button>
        </div>
    </div>

    <!-- KHU VỰC HIỂN THỊ ẢNH TRUYỆN -->
    <div class="container-fluid p-0 bg-black text-center mt-3 pb-5">
        <!-- Dùng dummy image, sau này Thymeleaf sẽ lặp th:each in ra mớ ảnh này -->
        <img src="https://via.placeholder.com/800x1200.png?text=Trang+1" class="comic-page" alt="Trang 1">
        <img src="https://via.placeholder.com/800x1200.png?text=Trang+2" class="comic-page" alt="Trang 2">
        <img src="https://via.placeholder.com/800x1200.png?text=Trang+3" class="comic-page" alt="Trang 3">
        <img src="https://via.placeholder.com/800x1200.png?text=Trang+4" class="comic-page" alt="Trang 4">
    </div>

    <!-- THANH CÔNG CỤ DƯỚI ĐÁY (Đọc xong cuộn xuống đáy bấm qua chương tiện hơn) -->
    <div class="py-3 border-top" style="background-color: var(--bs-tertiary-bg);">
        <div class="container d-flex justify-content-center align-items-center gap-3">
            <button class="btn btn-outline-danger btn-lg"><i class="bi bi-chevron-left"></i> Chap Trước</button>
            <button class="btn btn-danger btn-lg">Chap Sau <i class="bi bi-chevron-right"></i></button>
        </div>
    </div>

    <!-- THƯ VIỆN JS -->
    <!-- jQuery (Bắt buộc phải có để xài Select2) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script th:src="@{/user/js/doi_mau.js}"></script>
    <script>
        // 1. Khởi tạo cái ComboBox xịn xò Select2
        $(document).ready(function() {
            $('.select2-chuong').select2({
                placeholder: "Tìm kiếm chương...",
                width: '100%' // Đảm bảo nó dãn đều giao diện
            });

            // Sự kiện: Khi user chọn 1 chương khác, tự động nhảy trang (giả lập)
            $('#chonChuong').on('select2:select', function (e) {
                let chuongId = e.params.data.id;
                // Mốt thay URL bằng link thật của Spring Boot
                // window.location.href = "/doc-truyen?chuongId=" + chuongId;
                console.log("Đang chuyển sang chương ID: " + chuongId);
            });
        });
    </script>
</body>
</html>
