<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Cá Nhân - Tàng Kinh Các</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        .text-hot { color: #ff5722; font-weight: bold; }
        .btn-hot { background-color: #ff5722; color: white; border: none; }
        .btn-hot:hover { background-color: #e64a19; }
        .avatar-preview { width: 200px; height: 200px; object-fit: cover; border: 4px solid #ff5722; box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3); }
    </style>
</head>
<body>

    <!-- THANH ĐIỀU HƯỚNG (Ông copy nguyên cái Navbar của trang Index quăng qua đây nha) -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm border-bottom" style="background-color: var(--bs-body-bg);">
        <div class="container">
            <a class="navbar-brand text-hot" href="/index.html"><i class="bi bi-book-half"></i> Tàng Kinh Các</a>
            <!-- Tạm cắt ngắn navbar cho gọn đoạn code này, ông tự nhét vô đầy đủ nha -->
            <button class="btn ms-auto" id="btn-theme-toggle" style="border: none; font-size: 1.2rem;">
                <i class="bi bi-moon-stars-fill text-warning" id="icon-theme"></i>
            </button>
        </div>
    </nav>

    <!-- NỘI DUNG CHÍNH -->
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card bg-body-tertiary border-0 shadow-sm rounded-4">
                    <div class="card-header bg-transparent border-bottom p-4">
                        <h4 class="mb-0 fw-bold text-info"><i class="bi bi-person-vcard"></i> HỒ SƠ CÁ NHÂN</h4>
                    </div>
                    
                    <div class="card-body p-5">
                        <form action="/cap-nhat-user" method="POST" enctype="multipart/form-data">
                            <div class="row">
                                <!-- Cột Trái: Đổi Avatar -->
                                <div class="col-md-4 text-center mb-4 mb-md-0 border-end">
                                    <img src="https://via.placeholder.com/200" class="rounded-circle avatar-preview mb-3" alt="Avatar">
                                    
                                    <div class="mt-3">
                                        <label for="avatarUpload" class="btn btn-outline-warning w-100 fw-bold">
                                            <i class="bi bi-camera"></i> Đổi Ảnh Đại Diện
                                        </label>
                                        <!-- Thẻ input type file bị giấu đi, bấm vào nút Label ở trên nó sẽ kích hoạt -->
                                        <input type="file" id="avatarUpload" name="fileAvatar" class="d-none" accept="image/png, image/jpeg">
                                    </div>
                                    <small class="text-muted d-block mt-2">Định dạng JPEG, PNG. Tối đa 2MB.</small>
                                </div>

                                <!-- Cột Phải: Thông tin cá nhân -->
                                <div class="col-md-8 ps-md-4">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Tên hiển thị</label>
                                        <input type="text" class="form-control" name="hoTen" placeholder="Nhập họ tên của bạn..." value="Đạo Hữu Vô Danh">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Email</label>
                                        <input type="email" class="form-control" name="email" placeholder="Nhập địa chỉ email..." value="daohuu@example.com">
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Mật khẩu mới <small class="text-muted fw-normal">(Bỏ trống nếu không muốn đổi)</small></label>
                                        <input type="password" class="form-control" name="matKhauMoi" placeholder="Nhập mật khẩu mới...">
                                    </div>

                                    <hr>
                                    <div class="d-flex justify-content-end mt-4">
                                        <button type="reset" class="btn btn-secondary px-4 me-2">Nhập Lại</button>
                                        <button type="submit" class="btn btn-hot px-5 fw-bold"><i class="bi bi-floppy"></i> LƯU THAY ĐỔI</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Bootstrap & JS Đổi Màu -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/user/js/doi_mau.js}"></script>
    
    <!-- Script nhỏ để Preview (Xen trước) hình ảnh lúc mới chọn file -->
    <script>
        const avatarUpload = document.getElementById('avatarUpload');
        const previewImg = document.querySelector('.avatar-preview');

        avatarUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                previewImg.src = URL.createObjectURL(file);
            }
        });
    </script>
</body>
</html>
