<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Cá Nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/user/css/thong_tin_ca_nhan.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top shadow-sm border-bottom" style="background-color: var(--bs-body-bg);">
        <div class="container">
            <a class="navbar-brand text-hot" th:href="@{/}"><i class="bi bi-book-half"></i> Tàng Kinh Các</a>
            <button class="btn ms-auto" id="btn-theme-toggle" style="border: none; font-size: 1.2rem;">
                <i class="bi bi-moon-stars-fill text-warning" id="icon-theme"></i>
            </button>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card bg-body-tertiary border-0 shadow-sm rounded-4">
                    <div class="card-header bg-transparent border-bottom p-4">
                        <h4 class="mb-0 fw-bold text-info"><i class="bi bi-person-vcard"></i> HỒ SƠ CÁ NHÂN</h4>
                    </div>
                    
                    <div class="card-body p-5">
                        <form th:action="@{/xu-ly-cap-nhat-thong-tin}" method="POST" enctype="multipart/form-data">
                            <input type="hidden" name="id" th:value="${tkNguoiDung.getId()}">
                            <div class="row">
                                <!-- Cột Trái: Đổi Avatar -->
                                <div class="col-md-4 text-center mb-4 mb-md-0 border-end">
                                    <img class="rounded-circle avatar-preview mb-3"
                                    th:src="@{/images/avatar/{file}(file=${tkNguoiDung.avatar},t=${#dates.createNow().time})}">
                                    
                                    <div class="mt-3">
                                        <label for="avatarUpload" class="btn btn-outline-warning w-100 fw-bold">
                                            <i class="bi bi-camera"></i> Đổi Ảnh Đại Diện
                                        </label>
                                        <input type="file" id="avatarUpload" name="fileAvatar" class="d-none" accept="image/png, image/jpeg">
                                    </div>
                                    <small class="text-muted d-block mt-2">Định dạng JPEG, PNG. Tối đa 2MB.</small>
                                </div>

                                <!-- Cột Phải: Thông tin cá nhân -->
                                <div class="col-md-8 ps-md-4">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Tên hiển thị</label>
                                        <input type="text" class="form-control" name="hoTen" placeholder="Nhập họ tên của bạn..." th:value="${tkNguoiDung.getHoTen()}">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Email</label>
                                        <input type="email" class="form-control" name="email" placeholder="Nhập địa chỉ email..." th:value="${tkNguoiDung.getEmail()}">
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Mật khẩu mới <small class="text-muted fw-normal">(Bỏ trống nếu không muốn đổi)</small></label>
                                        <input type="password" class="form-control" name="matKhauMoi" placeholder="Nhập mật khẩu mới...">
                                    </div>

                                    <hr>
                                    <div class="d-flex justify-content-end mt-4">
                                        <a th:href="@{/}" class="btn btn-secondary px-4 me-2">Trở về</a>
                                        <button type="submit" class="btn btn-hot px-5 fw-bold"><i class="bi bi-floppy"></i> LƯU THAY ĐỔI</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${thongbao != null}" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div id="thongBaoToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${thongbao}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <div th:if="${loi != null}" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div id="loiToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${loi}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/user/js/doi_mau.js}"></script>
    <script th:src="@{/user/js/thong_bao.js}"></script>
    <script th:src="@{/user/js/thong_tin_ca_nhan.js}"></script>
</body>
</html>
