<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Kiếm Nâng Cao - Tàng Kinh Các</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        .truyen-bia { height: 250px; object-fit: cover; border-radius: 5px; }
        .text-hot { color: #ff5722; font-weight: bold; }
        .card-truyen { transition: 0.3s; border: none; }
        .card-truyen:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4); }
        .dropdown:hover .dropdown-menu {
            display: block;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="container mt-4">
        <h3 class="text-hot mb-4"><i class="bi bi-search"></i> Tìm Kiếm Nâng Cao</h3>

        <!-- BỘ LỌC TÌM KIẾM -->
        <div class="card bg-body-tertiary shadow-sm mb-5 border-0">
            <div class="card-body">
                <form th:action="@{/tim-kiem-nang-cao}" method="GET">
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label fw-bold">Tên truyện</label>
                            <input type="text" class="form-control" name="tenTruyen" placeholder="Nhập từ khóa tên truyện..." th:value="${tuKhoaTen}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tác giả</label>
                            <input type="text" class="form-control" name="tacGia" placeholder="Nhập tên tác giả..." th:value="${tuKhoaTacGia}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Thể loại (Có thể chọn nhiều)</label>

                        <div class="d-flex flex-wrap gap-2">
                            <div th:each="theLoai : ${dsTheLoai}">
                                <input type="checkbox" class="btn-check" 
                                       th:id="'tl' + ${theLoai.id}" 
                                       name="theLoai" 
                                       th:value="${theLoai.id}"
                                       th:checked="${listTheLoaiDaChon != null and #lists.contains(listTheLoaiDaChon, theLoai.id)}">
                                <label class="btn btn-outline-warning btn-sm px-3" th:for="'tl' + ${theLoai.id}" th:text="${theLoai.tenTheLoai}">Tiên Hiệp</label>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-danger px-5 fw-bold"><i class="bi bi-funnel-fill"></i> LỌC TRUYỆN</button>
                        <a th:href="@{/tim-kiem-nang-cao}" class="btn btn-secondary px-4 ms-2">Làm mới</a>
                    </div>
                </form>
            </div>
        </div>

<!-- Chỉ hiện dòng này khi ĐÃ BẤM TÌM KIẾM (danhSachTruyen khác null) -->
        <h5 th:if="${danhSachTruyen != null}" class="mb-3 fw-bold border-bottom pb-2">
            Kết quả tìm kiếm : ([[${soLuongTimThay}]] truyện)
        </h5>
        
        <div class="row">
            
            <div th:if="${danhSachTruyen != null and danhSachTruyen.isEmpty()}" class="col-12 text-center py-5 mt-4 bg-body-tertiary rounded shadow-sm">
                <h1 class="text-muted mb-3" style="font-size: 5rem;"><i class="bi bi-search"></i></h1>
                <h3 class="text-muted fw-bold">Không tìm thấy bất cứ bộ truyện nào!</h3>
                <p class="text-muted mb-4">Có vẻ như từ khóa đạo hữu tìm kiếm chưa xuất hiện trên giang hồ. Hãy thử đổi thể loại hoặc tên khác nhé!</p>
                <a th:href="@{/}" class="btn btn-warning fw-bold"><i class="bi bi-house-door-fill"></i> Về lại Trang Chủ</a>
            </div>

            <div th:unless="${danhSachTruyen == null or danhSachTruyen.isEmpty()}" th:each="truyen : ${danhSachTruyen}" class="col-6 col-md-3 mb-4">
                <a th:href="@{/chi-tiet-truyen/{tenTruyen}/{id}(tenTruyen=${truyen.slug}, id=${truyen.id})}" class="text-decoration-none text-body">
                    <div class="card card-truyen h-100 bg-body-tertiary">
                        <img th:src="@{'/images/truyen/' + ${truyen.anhBia}}" class="card-img-top truyen-bia" alt="Bìa truyện">
                        <div class="card-body p-2 text-center">
                            <h6 class="card-title text-truncate mb-1" th:text="${truyen.tenTruyen}">Ta Là Tà Đế</h6>
                            <small class="text-muted fw-bold text-danger" th:text="${truyen.chuongMoiNhat}">Chương 105</small>
                        </div>
                    </div>
                </a>
            </div>
            
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:src="@{/user/js/doi_mau.js}"></script>
</body>
</html>
