<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Tàng Kinh Các</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        /* Căn giữa toàn bộ màn hình */
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(33,37,41,1) 0%, rgba(18,18,18,1) 100%);
        }
        /* Tự động đổi màu nền gradient khi gạt sang Light Mode */
        [data-bs-theme="light"] body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }
        
        /* Hiệu ứng thẻ đăng nhập */
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .text-hot { color: #ff5722; }
        .btn-hot { background-color: #ff5722; color: white; border: none; transition: 0.3s; }
        .btn-hot:hover { background-color: #e64a19; transform: translateY(-2px); }
    </style>
</head>
<body>

    <!-- Nút đổi theme nằm lơ lửng ở góc phải trên cùng -->
    <button class="btn position-absolute top-0 end-0 m-3" id="btn-theme-toggle" style="font-size: 1.5rem; border: none;">
        <i class="bi bi-moon-stars-fill text-warning" id="icon-theme"></i>
    </button>

    <!-- Form Đăng Nhập -->
    <div class="card login-card bg-body-tertiary p-4">
        <div class="text-center mb-4">
            <h2 class="text-hot fw-bold"><i class="bi bi-book-half"></i> Tàng Kinh Các</h2>
            <p class="text-muted">Đăng nhập để lưu truyện và bình luận</p>
        </div>
        
        <form th:action="@{/xu-ly-dang-nhap}" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Nhập tài khoản của bạn...">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu...">
                </div>
            </div>

            <button type="submit" class="btn btn-hot w-100 fw-bold py-2 mb-3">ĐĂNG NHẬP</button>
            
            <div class="text-center">
                <span class="text-muted">Chưa có tài khoản? </span>
                <a th:href="@{/dang-ky}" class="text-decoration-none text-hot fw-bold">Đăng ký ngay</a>
            </div>
        </form>
    </div>

    <div th:if="${loi}" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div id="loiToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${loi}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const loiElement = document.getElementById('loiToast');
            if(loiElement) new bootstrap.Toast(loiElement, { delay: 4000 }).show();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/user/js/doi_mau.js}"></script>
</body>
</html>
