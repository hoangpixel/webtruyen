<!DOCTYPE html>
<!-- Thêm data-bs-theme="dark" để mặc định mở lên là ban đêm -->
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" th:href="@{/user/css/index.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container mt-4">
        
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

        <h4 th:if="${danhSachHot} != null" class="text-hot mb-3"><i class="bi bi-fire"></i> Top 10 bộ truyện HOT</h4>
        
        <div th:if="${danhSachHot} != null" class="swiper mySwiper mb-5">
            <div class="swiper-wrapper">
                
                <div class="swiper-slide" th:each="truyen : ${danhSachHot}">
                    <div class="card h-100 bg-body-tertiary shadow-sm text-center">
                        <a th:href="@{/chi-tiet-truyen/{tenTruyen}/{id}(tenTruyen=${truyen.slug}, id=${truyen.id})}" class="text-decoration-none text-body">
                            <img th:src="@{'/images/truyen/' + ${truyen.anhBia}}" class="card-img-top truyen-bia" alt="Bìa truyện">
                            
                            <div class="card-body p-2">
                                <h6 class="card-title mb-1 text-truncate fw-bold text-info" th:text="${truyen.tenTruyen}">Ta Là Tà Đế</h6>
                                <small class="text-muted"><i class="bi bi-eye text-warning"></i> ([[${#numbers.formatInteger(truyen.luotXem, 0, 'COMMA')}]] lượt)</small>
                            </div>
                        </a>
                    </div>
                </div>

            </div>

            <div class="swiper-button-next" style="color: #ff5722;"></div>
            <div class="swiper-button-prev" style="color: #ff5722;"></div>
        </div>

        <h4 th:unless="${danhSachTruyen == null or danhSachTruyen.isEmpty()}" class="text-warning mb-3"><i class="bi bi-clock-history"></i> Mới Cập Nhật</h4>

        <div class="row">
            
            <div th:if="${danhSachTruyen == null or danhSachTruyen.isEmpty()}" class="col-12 text-center py-5 mt-4 bg-body-tertiary rounded shadow-sm">
                <h1 class="text-muted mb-3" style="font-size: 5rem;"><i class="bi bi-search"></i></h1>
                <h3 class="text-muted fw-bold">Không tìm thấy bất cứ bộ truyện nào!</h3>
                <p class="text-muted mb-4">Có vẻ như từ khóa <strong class="text-warning" th:text="${tuKhoa}"></strong> của đạo hữu chưa xuất hiện trên giang hồ. Hãy thử tìm bằng một tên khác nhé!</p>
                <a th:href="@{/}" class="btn btn-warning fw-bold"><i class="bi bi-house-door-fill"></i> Về lại Trang Chủ</a>
            </div>

            <div th:unless="${danhSachTruyen == null or danhSachTruyen.isEmpty()}" th:each="truyen : ${danhSachTruyen}" class="col-6 col-md-3 mb-4">
                <a th:href="@{/chi-tiet-truyen/{tenTruyen}/{id}(tenTruyen=${truyen.slug}, id=${truyen.id})}" class="text-decoration-none text-body">
                    
                    <div class="card h-100 bg-body-tertiary shadow-sm position-relative">

                        <span class="badge bg-danger badge-chapter fw-bold" th:text="${truyen.chuongMoiNhat}">Chapter 100</span>

                        <img th:src="@{'/images/truyen/' + ${truyen.anhBia}}" class="card-img-top truyen-bia" alt="Bìa truyện">
                        
                        <div class="card-body p-3 text-center">
                            <h6 class="card-title text-truncate fw-bold text-info fs-6 mb-0" th:text="${truyen.tenTruyen}">Tên Truyện</h6>
                        </div>
                        
                    </div>
                </a>
            </div>

        </div>

        <div th:replace="~{fragments/phan_trang :: phantrang(
            duongDan=${tuKhoa != null ? '/tim-kiem?tenTruyen=' + tuKhoa : ''}, 
            trangHienTai=${trangHienTai}, 
            tongSoTrang=${tongSoTrang}
            )}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script th:src="@{/user/js/doi_mau.js}"></script>
    <script th:src="@{/user/js/animation_truyen.js}"></script>
</body>
</html>
