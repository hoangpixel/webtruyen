<!DOCTYPE html>
<!-- Thêm data-bs-theme="dark" để mặc định mở lên là ban đêm -->
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Web Đọc Truyện</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        /* CSS giờ cực mỏng nhẹ vì Bootstrap lo hết màu sắc rồi */
        .card { transition: 0.3s; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4); }
        .truyen-bia { height: 250px; object-fit: cover; }
        .text-hot { color: #ff5722; font-weight: bold; }
        .dropdown:hover .dropdown-menu {
            display: block;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- KHOẢNG TRỐNG NỘI DUNG CHÍNH -->
    <div class="container mt-4">
        
<!-- 1. Nhúng CSS của SwiperJS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

        <h4 class="text-hot mb-3"><i class="bi bi-fire"></i> Top 10 bộ truyện HOT</h4>
        
        <!-- 2. Khung Slider -->
        <div class="swiper mySwiper mb-5">
            <div class="swiper-wrapper">
                
                <!-- Vòng lặp th:each giờ sẽ nằm ở thẻ swiper-slide -->
                <div class="swiper-slide" th:each="truyen : ${danhSachHot}">
                    <div class="card h-100 bg-body-tertiary shadow-sm text-center">
                        <a th:href="@{/chi-tiet-truyen/{id}(id=${truyen.id})}" class="text-decoration-none text-body">
                            <!-- Bìa truyện -->
                            <img th:src="@{'/images/truyen/' + ${truyen.anhBia}}" class="card-img-top truyen-bia" alt="Bìa truyện" style="object-fit: cover; aspect-ratio: 2/3;">
                            
                            <div class="card-body p-2">
                                <h6 class="card-title mb-1 text-truncate fw-bold text-info" th:text="${truyen.tenTruyen}">Ta Là Tà Đế</h6>
                                <small class="text-muted"><i class="bi bi-eye text-warning"></i> ([[${#numbers.formatInteger(truyen.luotXem, 0, 'COMMA')}]] lượt)</small>
                            </div>
                        </a>
                    </div>
                </div>

            </div>
            <!-- Mũi tên bấm qua lại (tùy chọn, thêm vào cho Pro) -->
            <div class="swiper-button-next" style="color: #ff5722;"></div>
            <div class="swiper-button-prev" style="color: #ff5722;"></div>
        </div>

<!-- KHU VỰC MỚI CẬP NHẬT -->
        <h4 class="text-warning mb-3"><i class="bi bi-clock-history"></i> Mới Cập Nhật</h4>
        <div class="row">
            
            <div th:each="truyen : ${danhSachTruyen}" class="col-6 col-md-4 col-lg-3 mb-4">
                <a th:href="@{/chi-tiet-truyen/{id}(id=${truyen.id})}" class="text-decoration-none text-body">
                    <div class="card h-100 bg-body-tertiary shadow-sm">

                        <img th:src="@{'/images/truyen/' + ${truyen.anhBia}}" class="card-img-top" style="object-fit: cover; height: 350px;" alt="Bìa truyện">
                        
                        <div class="card-body p-3 text-center">
                            <h6 class="card-title text-truncate fw-bold text-info fs-6" th:text="${truyen.tenTruyen}">Tên Truyện</h6>
                            <span class="badge bg-danger mt-1" th:text="${truyen.chuongMoiNhat}">Chapter 100</span>
                        </div>
                    </div>
                </a>
            </div>

        </div>


        <!-- Phân trang -->
        <div th:replace="~{fragments/phan_trang :: phantrang(duongDan='', trangHienTai=${trangHienTai}, tongSoTrang=${tongSoTrang})}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script th:src="@{/user/js/doi_mau.js}"></script>
    <script>
        var swiper = new Swiper(".mySwiper", {
            spaceBetween: 15, // Khoảng cách giữa các cuốn truyện
            autoplay: {
                delay: 5000, // Cứ 5 giây (5000ms) là tự động trượt
                disableOnInteraction: false, // Bấm vào rồi nó vẫn tự trượt tiếp
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            // Reponsive: Tự động tính toán số lượng truyện trên từng thiết bị
            breakpoints: {
                0: {
                    slidesPerView: 2, // Điện thoại nhỏ: Hiện 2 cuốn
                },
                768: {
                    slidesPerView: 3, // iPad: Hiện 3 cuốn
                },
                1024: {
                    slidesPerView: 4, // Máy tính PC: Hiện đúng 4 cuốn như ông muốn
                },
            },
        });
    </script>
</body>
</html>
