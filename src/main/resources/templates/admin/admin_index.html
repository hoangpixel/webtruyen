<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sở Chỉ Huy - Tàng Kinh Các</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        #wrapper { display: flex; width: 100%; overflow-x: hidden; }
        #sidebar { 
            min-width: 260px; max-width: 260px; 
            min-height: 100vh; 
            background-color: var(--bs-tertiary-bg); 
            border-right: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease-in-out; 
        }
        #sidebar.toggled { margin-left: -260px; }
        #content-wrapper { width: 100%; transition: all 0.3s; }
        .nav-link { color: var(--bs-body-color); padding: 15px 20px; font-weight: 500; transition: 0.2s; border-left: 4px solid transparent; }
        .nav-link:hover, .nav-link.active { 
            background-color: rgba(255, 87, 34, 0.1); 
            color: #ff5722; 
            border-left: 4px solid #ff5722; 
        }
        .text-hot { color: #ff5722; }
    </style>
</head>
<body>

    <div id="wrapper">
        
        <!-- 1. GỌI BÙA FRAGMENT SIDEBAR RA ĐÂY -->
        <div th:replace="~{fragments/admin_sidebar :: sidebar}"></div>

        <!-- 2. KHU VỰC NỘI DUNG BÊN PHẢI -->
        <div id="content-wrapper">
            
            <div th:replace="~{fragments/admin_topbar :: topbar}"></div>

            <!-- BẢNG ĐIỀU KHIỂN CHÍNH (DASHBOARD) -->
            <div class="container-fluid p-4">
                 <!-- ... (Cục nội dung Dashboard 4 cái thẻ màu mè và bảng truyện của ông giữ y nguyên ở đây) ... -->
            </div>
            
        </div>
    </div>

    <!-- Script của Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script xử lý gập/mở Menu Trái -->
    <script>
        document.getElementById('sidebarCollapse').addEventListener('click', function () {
            document.getElementById('sidebar').classList.toggle('toggled');
        });
    </script>
    
    <script th:src="@{/user/js/doi_mau.js}"></script>
</body>
</html>
