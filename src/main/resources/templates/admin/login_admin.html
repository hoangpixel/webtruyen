<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị - Tàng Kinh Các</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        /* Căn giữa toàn bộ trang */
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bs-body-bg);
            margin: 0;
        }
        
        /* Bọc khung form */
        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: var(--bs-tertiary-bg);
        }
        
        .login-header {
            border-bottom: 2px solid #ff5722;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        
        .text-hot { color: #ff5722; }
        
        .btn-admin {
            background-color: #ff5722;
            color: white;
            border: none;
            transition: 0.3s;
        }
        
        .btn-admin:hover {
            background-color: #e64a19;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.4);
        }
    </style>
</head>
<body>

    <div class="card login-card p-4 mx-3">
        <div class="card-body p-0">
            <!-- Header -->
            <div class="text-center login-header">
                <h2 class="text-hot fw-bold"><i class="bi bi-shield-lock-fill"></i> ADMIN PANEL</h2>
                <p class="text-muted mb-0">Cổng Đăng Nhập Sở Chỉ Huy</p>
            </div>

            <!-- Khối báo lỗi (Chỉ hiện khi Controller ném biến 'loi' ra) -->
            <div th:if="${loi}" class="alert alert-danger text-center py-2 fw-bold" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${loi}"></span>
            </div>

            <!-- Form đăng nhập Admin -->
            <form th:action="@{/admin/login}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="bi bi-person-fill text-info"></i> Tên đăng nhập</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white" name="username" placeholder="Nhập tài khoản quản trị..." required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold"><i class="bi bi-key-fill text-warning"></i> Mật khẩu</label>
                    <input type="password" class="form-control bg-dark border-secondary text-white" name="password" placeholder="Nhập mật khẩu..." required>
                </div>
                
                <button type="submit" class="btn btn-admin w-100 fw-bold py-2 fs-5">
                    ĐĂNG NHẬP <i class="bi bi-box-arrow-in-right"></i>
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a th:href="@{/}" class="text-decoration-none text-muted small hover-warning">
                    <i class="bi bi-arrow-left"></i> Quay lại trang chủ web truyện
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
