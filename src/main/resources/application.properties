# 1. Cấu hình cổng chạy Server (Mặc định 8080)
server.port=8080

# 2. Kết nối Database MySQL (Tạo sẵn 1 database tên là 'webtruyen' trống trong localhost nha)
spring.datasource.url=jdbc:mysql://localhost:3306/webtruyen?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Cấu hình bùa chú JPA & Hibernate
# 'update': Tự động tạo bảng, thêm cột mới nếu code Java thay đổi, không làm mất data cũ
spring.jpa.hibernate.ddl-auto=update

# Bật cái này lên để xem console nó in ra câu lệnh SQL (rất tiện để debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.servlet.context-path=/webtruyen

# 1. Giới hạn dung lượng cho MỖI FILE ảnh đơn lẻ
spring.servlet.multipart.max-file-size=50MB

# 2. Giới hạn TỔNG DUNG LƯỢNG cho toàn bộ request (Nâng lên hẳn 500MB cho 1 chương)
spring.servlet.multipart.max-request-size=500MB

# 3. Nâng giới hạn Form Post của lõi Tomcat
server.tomcat.max-http-form-post-size=500MB

# 4. Tránh đứt kết nối ngầm của Tomcat
server.tomcat.max-swallow-size=500MB

# 5. Cấm DevTools restart khi lưu ảnh vào thư mục tĩnh
spring.devtools.restart.exclude=static/**,public/**,templates/**